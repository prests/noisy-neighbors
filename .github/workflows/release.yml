name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      source_version: ${{ steps.release.outputs.source_version }}
      fabric_version: ${{ steps.release.outputs.fabric_version }}
      neoforge_version: ${{ steps.release.outputs.neoforge_version }}
      minecraft_version: ${{ steps.release.outputs.minecraft_version }}
      type: ${{ steps.release.outputs.type }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -E '^version=' gradle.properties | cut -d= -f2-)"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          test -n "$version"
          test -n "$minecraft_version"
          source_version="v$version-mc$minecraft_version"
          legacy_fabric_version="$source_version-fabric"
          tag="$source_version"

          for existing in "$tag" "$legacy_fabric_version"; do
            if git ls-remote --exit-code --refs origin "refs/tags/$existing" >/dev/null; then
              echo "Tag $existing already exists; refusing to publish a duplicate release." >&2
              exit 1
            fi
          done

          git log -1 --format=%b > RELEASE_NOTES.md
          if ! grep -q '[[:alnum:]]' RELEASE_NOTES.md; then
            echo "The selected branch's latest commit has no release-note body." >&2
            exit 1
          fi

          if [[ "$version" == *-beta* ]]; then
            type=beta
            prerelease=true
          else
            type=release
            prerelease=false
          fi

          {
            echo "source_version=$source_version"
            echo "fabric_version=$source_version-fabric"
            echo "neoforge_version=$source_version-neoforge"
            echo "minecraft_version=$minecraft_version"
            echo "tag=$tag"
            echo "type=$type"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and test both loaders
        run: ./gradlew build
      - name: Install headless OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Run Fabric production client GameTest
        env:
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: ./gradlew runProductionClientGameTest
      - name: Stage NeoForge production client test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/mods
          cp neoforge/build/libs/*-neoforge.jar run/mods/
          cp neoforge/build/libs/*-neoforge-client-test.jar run/mods/
          rm -f run/noisy-neighbors-neoforge-success
      - name: Run NeoForge production client test
        uses: headlesshq/mc-runtime-test@dfc8a2a0145f723b01abda5e1cf59eaba516d128 # 5.0.0
        with:
          mc: '26.3'
          modloader: neoforge
          java: '25'
          mc-runtime-test: neoforge
          mc-runtime-test-version: '5.0.0'
          cache-mc: github
          headlessmc-command: '--jvm "-Djava.awt.headless=true -DMcRuntimeGameTest=false"'
      - name: Verify NeoForge client assertions ran
        run: test -f run/noisy-neighbors-neoforge-success
      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fabric=(fabric/build/libs/*-fabric.jar)
          neoforge=(neoforge/build/libs/*-neoforge.jar)
          [[ ${#fabric[@]} -eq 1 ]] || { printf 'Expected one Fabric JAR, found: %s\n' "${fabric[*]:-none}" >&2; exit 1; }
          [[ ${#neoforge[@]} -eq 1 ]] || { printf 'Expected one NeoForge JAR, found: %s\n' "${neoforge[*]:-none}" >&2; exit 1; }

          version="$(grep -E '^version=' gradle.properties | cut -d= -f2-)"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          mkdir release
          fabric_target="release/noisy-neighbors-$version-mc$minecraft_version-fabric.jar"
          neoforge_target="release/noisy-neighbors-$version-mc$minecraft_version-neoforge.jar"
          cp "${fabric[0]}" "$fabric_target"
          cp "${neoforge[0]}" "$neoforge_target"
          sha256sum "$fabric_target" > "$fabric_target.sha256"
          sha256sum "$neoforge_target" > "$neoforge_target.sha256"
          cp RELEASE_NOTES.md release/
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          if-no-files-found: error
          path: release/*
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/logs/**
            run/logs/**
            run/crash-reports/**

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release
      - name: Publish Fabric and create GitHub release
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ needs.build.outputs.commit }}
          github-files: |
            release/*-fabric.jar
            release/*-fabric.jar.sha256
            release/*-neoforge.jar
            release/*-neoforge.jar.sha256
          files: release/*-fabric.jar
          name: Noisy Neighbors ${{ needs.build.outputs.fabric_version }}
          github-name: Noisy Neighbors ${{ needs.build.outputs.source_version }}
          version: ${{ needs.build.outputs.fabric_version }}
          version-type: ${{ needs.build.outputs.type }}
          loaders: fabric
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          java: 25
          environment: client
          dependencies: fabric-api(required)
          changelog-file: release/RELEASE_NOTES.md
          github-generate-changelog: false
          github-prerelease: ${{ needs.build.outputs.prerelease }}
      - name: Publish NeoForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release/*-neoforge.jar
          name: Noisy Neighbors ${{ needs.build.outputs.neoforge_version }}
          version: ${{ needs.build.outputs.neoforge_version }}
          version-type: ${{ needs.build.outputs.type }}
          loaders: neoforge
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          java: 25
          environment: client
          changelog-file: release/RELEASE_NOTES.md
