name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      type: ${{ steps.release.outputs.type }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep -E '^version=' gradle.properties | cut -d= -f2-)"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          test -n "$version"
          test -n "$minecraft_version"
          release_version="v$version-mc$minecraft_version-fabric"
          tag="$release_version"

          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to publish a duplicate release." >&2
            exit 1
          fi

          git log -1 --format=%b > RELEASE_NOTES.md
          if ! grep -q '[[:alnum:]]' RELEASE_NOTES.md; then
            echo "The latest main commit has no release-note body." >&2
            exit 1
          fi

          if [[ "$version" == *-beta* ]]; then
            type=beta
            prerelease=true
          else
            type=release
            prerelease=false
          fi

          {
            echo "version=$release_version"
            echo "tag=$tag"
            echo "type=$type"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and run JVM/server tests
        run: ./gradlew build

      - name: Install headless OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Run production client GameTest
        env:
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: ./gradlew runProductionClientGameTest

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          artifacts=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-sources.jar|*-javadoc.jar|*-gametest.jar) ;;
              *) artifacts+=("$jar") ;;
            esac
          done

          if [[ ${#artifacts[@]} -ne 1 ]]; then
            printf 'Expected exactly one distributable JAR; found: %s\n' "${artifacts[*]:-none}" >&2
            exit 1
          fi

          mkdir release
          cp "${artifacts[0]}" release/release.jar
          sha256sum release/release.jar > release/release.jar.sha256
          cp RELEASE_NOTES.md release/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          if-no-files-found: error
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Publish release
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ needs.build.outputs.commit }}
          github-files: |
            release/release.jar
            release/release.jar.sha256
          files: release/release.jar
          name: Noisy Neighbors ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.type }}
          changelog-file: release/RELEASE_NOTES.md
          github-generate-changelog: false
          github-prerelease: ${{ needs.build.outputs.prerelease }}
