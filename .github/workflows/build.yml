name: build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
      - name: Build and test both loaders
        run: ./gradlew build
      - name: Verify distributable artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fabric=(fabric/build/libs/*-fabric.jar)
          neoforge=(neoforge/build/libs/*-neoforge.jar)
          [[ ${#fabric[@]} -eq 1 ]] || { printf 'Expected one Fabric JAR, found: %s\n' "${fabric[*]:-none}" >&2; exit 1; }
          [[ ${#neoforge[@]} -eq 1 ]] || { printf 'Expected one NeoForge JAR, found: %s\n' "${neoforge[*]:-none}" >&2; exit 1; }
      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noisy-neighbors-jars
          if-no-files-found: error
          path: |
            fabric/build/libs/*-fabric.jar
            neoforge/build/libs/*-neoforge.jar
