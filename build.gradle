plugins {
  id 'base'
  id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
  id 'net.neoforged.moddev' version "${moddevgradle_version}" apply false
}

allprojects {
  group = rootProject.group
  version = rootProject.version
}

subprojects {
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
  }

  tasks.withType(JavaCompile).configureEach {
    options.release = rootProject.java_version as int
  }
}

tasks.named('clean') {
  dependsOn(':common:clean', ':fabric:clean', ':neoforge:clean')
}

tasks.named('build') {
  dependsOn(':common:test', ':fabric:build', ':neoforge:build')
}

tasks.register('test') {
  group = 'verification'
  description = 'Runs the shared JVM test suite.'
  dependsOn(':common:test')
}

tasks.register('runProductionClientGameTest') {
  group = 'verification'
  description = 'Runs the Fabric production client GameTest.'
  dependsOn(':fabric:runProductionClientGameTest')
}

tasks.register('runFabricClient') {
  group = 'application'
  description = 'Runs the Fabric development client.'
  dependsOn(':fabric:runClient')
}

tasks.register('runNeoForgeClient') {
  group = 'application'
  description = 'Runs the NeoForge development client.'
  dependsOn(':neoforge:runClient')
}
